version: "3.8"

# ──────────────────────────────────────────────────────────────────
# Stack Fluxtic Salud — Fluxtic Cloud Administrado
# Traefik global: red "proxy" / certresolver "le"
# ──────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL dedicado ────────────────────────────────────────
  postgres-salud:
    image: postgres:16-alpine
    container_name: postgres-salud
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       postgres
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - salud_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis dedicado ─────────────────────────────────────────────
  redis-salud:
    image: redis:7-alpine
    container_name: redis-salud
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./redis/data:/data
    networks:
      - salud_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── n8n dedicado (instancia del cliente) ───────────────────────
  n8n-salud:
    image: n8nio/n8n:latest
    container_name: n8n-salud
    restart: unless-stopped
    environment:
      N8N_HOST:               n8n-salud.fluxtic.com
      N8N_PORT:               "5678"
      N8N_PROTOCOL:           https
      WEBHOOK_URL:            https://n8n-salud.fluxtic.com/
      N8N_EDITOR_BASE_URL:    https://n8n-salud.fluxtic.com
      N8N_PROXY_HOPS:         "1"
      DB_TYPE:                postgresdb
      DB_POSTGRESDB_HOST:     postgres-salud
      DB_POSTGRESDB_PORT:     "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB}
      DB_POSTGRESDB_USER:     ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA:   public
      N8N_ENCRYPTION_KEY:         ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE:      "true"
      N8N_BASIC_AUTH_USER:        ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD:    ${N8N_PASSWORD}
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ:               America/Argentina/Buenos_Aires
      N8N_VARS_WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      N8N_VARS_API_BASE_URL:       https://api-salud.fluxtic.com
      EXECUTIONS_DATA_SAVE_ON_ERROR:   all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: last
      EXECUTIONS_DATA_MAX_AGE:         "720"
      N8N_DIAGNOSTICS_ENABLED:         "false"
    volumes:
      - ./n8n/data:/home/node/.n8n
    networks:
      - proxy
      - salud_internal
      - outbound
    depends_on:
      postgres-salud:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.n8n-salud.rule=Host(`n8n-salud.fluxtic.com`)"
      - "traefik.http.routers.n8n-salud.entrypoints=websecure"
      - "traefik.http.routers.n8n-salud.tls.certresolver=le"
      - "traefik.http.services.n8n-salud.loadbalancer.server.port=5678"

  # ── MinIO dedicado ─────────────────────────────────────────────
  minio-salud:
    image: minio/minio:latest
    container_name: minio-salud
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - ./minio/data:/data
    networks:
      - proxy
      - salud_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.storage-salud.rule=Host(`storage-salud.fluxtic.com`)"
      - "traefik.http.routers.storage-salud.entrypoints=websecure"
      - "traefik.http.routers.storage-salud.tls.certresolver=le"
      - "traefik.http.routers.storage-salud.service=storage-salud-svc"
      - "traefik.http.services.storage-salud-svc.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-salud.rule=Host(`minio-salud.fluxtic.com`)"
      - "traefik.http.routers.minio-salud.entrypoints=websecure"
      - "traefik.http.routers.minio-salud.tls.certresolver=le"
      - "traefik.http.routers.minio-salud.service=minio-salud-svc"
      - "traefik.http.services.minio-salud-svc.loadbalancer.server.port=9001"

  # ── API Fastify + Prisma ───────────────────────────────────────
  api-salud:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-salud
    restart: unless-stopped
    environment:
      NODE_ENV:            production
      PORT:                "3001"
      DATABASE_URL:        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-salud:5432/salud_app
      REDIS_URL:           redis://:${REDIS_PASSWORD}@redis-salud:6379
      INTERNAL_API_TOKEN:  ${INTERNAL_API_TOKEN}
      CORS_ORIGINS:        https://admin-salud.fluxtic.com,https://portal-salud.fluxtic.com
      N8N_WEBHOOK_BASE_URL: ${N8N_WEBHOOK_BASE_URL}
      # MinIO / storage clínico
      S3_ENDPOINT:         http://minio-salud:9000
      S3_PUBLIC_ENDPOINT:  https://storage-salud.fluxtic.com
      S3_ACCESS_KEY:       ${MINIO_USER}
      S3_SECRET_KEY:       ${MINIO_PASSWORD}
      S3_BUCKET_HC:        historia-clinica
      # Pagos (heredado, copagos opcionales)
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL}
      MERCADOPAGO_SUCCESS_URL: ${MERCADOPAGO_SUCCESS_URL}
      MERCADOPAGO_PENDING_URL: ${MERCADOPAGO_PENDING_URL}
      MERCADOPAGO_FAILURE_URL: ${MERCADOPAGO_FAILURE_URL}
      # Comunicaciones (heredado)
      WA_PHONE_NUMBER_ID:      ${WA_PHONE_NUMBER_ID}
      WA_ACCESS_TOKEN:         ${WA_ACCESS_TOKEN}
      WA_WEBHOOK_VERIFY_TOKEN: ${WA_WEBHOOK_VERIFY_TOKEN}
      # Anti-bot del portal público
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      postgres-salud:
        condition: service_healthy
    networks:
      - proxy
      - salud_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.api-salud.rule=Host(`api-salud.fluxtic.com`)"
      - "traefik.http.routers.api-salud.entrypoints=websecure"
      - "traefik.http.routers.api-salud.tls.certresolver=le"
      - "traefik.http.services.api-salud.loadbalancer.server.port=3001"

  # ── App Next.js — Panel Admin + Portal Paciente ────────────────
  admin-salud:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL:            https://api-salud.fluxtic.com
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID:   ${GOOGLE_CLIENT_ID}
    container_name: admin-salud
    restart: unless-stopped
    environment:
      NODE_ENV:              production
      NEXTAUTH_URL:          https://admin-salud.fluxtic.com
      NEXTAUTH_SECRET:       ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL:   https://api-salud.fluxtic.com
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID:   ${GOOGLE_CLIENT_ID}
      INTERNAL_API_URL:      http://api-salud:3001
      INTERNAL_API_TOKEN:    ${INTERNAL_API_TOKEN}
    depends_on:
      - api-salud
    networks:
      - proxy
      - salud_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Admin panel
      - "traefik.http.routers.admin-salud.rule=Host(`admin-salud.fluxtic.com`)"
      - "traefik.http.routers.admin-salud.service=admin-salud"
      - "traefik.http.routers.admin-salud.entrypoints=websecure"
      - "traefik.http.routers.admin-salud.tls.certresolver=le"
      - "traefik.http.services.admin-salud.loadbalancer.server.port=3000"
      # Portal del paciente
      - "traefik.http.routers.portal-salud.rule=Host(`portal-salud.fluxtic.com`)"
      - "traefik.http.routers.portal-salud.service=admin-salud"
      - "traefik.http.routers.portal-salud.entrypoints=websecure"
      - "traefik.http.routers.portal-salud.tls.certresolver=le"
      - "traefik.http.services.portal-salud.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true          # Red global de Traefik — ya existe
  salud_internal:
    name: salud_internal
    driver: bridge
    internal: true          # Sin acceso a internet directo
  outbound:
    driver: bridge
